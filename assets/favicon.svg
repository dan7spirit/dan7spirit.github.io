<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Hexagon / Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="2.5" />
  <!-- Circuit Nodes & Glow -->
  <circle cx="20" cy="20" r="2.5" fill="#06B6D4" opacity="0.6"/>
  <circle cx="80" cy="80" r="2.5" fill="#8B5CF6" opacity="0.6"/>
  <path d="M20 20 L35 35 M80 80 L65 65" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.4"/>
  <!-- Monogram D S -->
  <g filter="url(#shadow)">
    <!-- Letter D stylized -->
    <path d="M30 28 L46 28 C57 28 64 36 64 50 C64 64 57 72 46 72 L30 72 Z M41 38 L41 62 L46 62 C51 62 54 57 54 50 C54 43 51 38 46 38 Z" fill="url(#glowGrad)" />
    <!-- Letter S stylized accent curve -->
    <path d="M48 35 C52 32 58 33 62 36 L58 42 C55 39 52 39 49 41 C46 43 46 46 49 48 L56 52 C63 56 63 64 56 68 C50 71 43 69 38 65 L42 59 C45 62 49 63 53 61 C56 59 56 56 53 54 L46 50 C40 46 40 39 48 35 Z" fill="#38BDF8" opacity="0.9" />
  </g>
</svg>
