<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="400" height="400" rx="48" fill="url(#bgGrad2)"/>
  <circle cx="200" cy="200" r="170" fill="url(#haloGlow)"/>

  <!-- Tech Grid / Circuit Ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#cyberNeon)" stroke-width="2" opacity="0.8"/>
  <circle cx="200" cy="40" r="4" fill="#06b6d4" filter="url(#softGlow)"/>
  <circle cx="340" cy="200" r="4" fill="#a855f7" filter="url(#softGlow)"/>
  <circle cx="60" cy="200" r="4" fill="#3b82f6" filter="url(#softGlow)"/>
  <circle cx="200" cy="360" r="4" fill="#06b6d4" filter="url(#softGlow)"/>

  <!-- Character Silhouette & Modern Attire -->
  <!-- Shoulders / Jacket -->
  <path d="M100 370 C100 295, 140 270, 200 270 C260 270, 300 295, 300 370 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Inner shirt / Collar -->
  <path d="M165 270 L200 320 L235 270 Z" fill="#0f172a" />
  <path d="M175 270 L200 305 L225 270 Z" fill="#0284c7" opacity="0.4" />
  <!-- Neck -->
  <path d="M175 220 L175 275 C185 285 215 285 225 275 L225 220 Z" fill="#f1c29b" />
  
  <!-- Head & Face -->
  <path d="M140 180 C140 240, 160 260, 200 260 C240 260, 260 240, 260 180 C260 120, 240 110, 200 110 C160 110, 140 120, 140 180 Z" fill="#ffd2a4" />
  
  <!-- Stylish Modern Hair -->
  <path d="M135 165 C132 130, 150 95, 200 95 C245 95, 265 125, 265 155 C255 140, 240 135, 215 135 C180 135, 155 145, 135 165 Z" fill="#1e293b" />
  <!-- Beard / Stubble -->
  <path d="M150 185 C150 245, 165 258, 200 258 C235 258, 250 245, 250 185 C250 215, 235 248, 200 248 C165 248, 150 215, 150 185 Z" fill="#334155" opacity="0.85" />
  <path d="M185 225 C190 220 210 220 215 225 C205 230 195 230 185 225 Z" fill="#1e293b" />

  <!-- Modern Tech Glasses -->
  <rect x="148" y="162" width="42" height="28" rx="8" fill="none" stroke="url(#cyberNeon)" stroke-width="3.5" filter="url(#softGlow)"/>
  <rect x="210" y="162" width="42" height="28" rx="8" fill="none" stroke="url(#cyberNeon)" stroke-width="3.5" filter="url(#softGlow)"/>
  <line x1="190" y1="174" x2="210" y2="174" stroke="url(#cyberNeon)" stroke-width="3" />
  <!-- Lens reflection -->
  <line x1="152" y1="184" x2="168" y2="166" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <line x1="214" y1="184" x2="230" y2="166" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

  <!-- Glowing Headset / Smart Device Accent -->
  <circle cx="262" cy="180" r="7" fill="#06b6d4" filter="url(#softGlow)"/>
  <path d="M260 186 C255 205 235 218 220 220" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Floating Badges / Hologram Chips -->
  <!-- GCP Cloud Architect Chip -->
  <g transform="translate(45, 75)">
    <rect width="85" height="32" rx="16" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
    <text x="42" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">☁ GCP Arch</text>
  </g>
  <!-- LangGraph Agent Chip -->
  <g transform="translate(265, 75)">
    <rect width="90" height="32" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" opacity="0.95"/>
    <text x="45" y="20" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ LangGraph</text>
  </g>
  <!-- Full-Stack Chip -->
  <g transform="translate(255, 300)">
    <rect width="105" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
    <text x="52" y="20" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🔥 640 hrs/mo</text>
  </g>
</svg>
